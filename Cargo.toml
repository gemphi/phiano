[package]
name = "phiano"
version = "0.2.0"
edition = "2021"

[lib]
name = "phiano"
path = "src/lib.rs"

[[bin]]
name = "phiano"
path = "src/main.rs"

[[bin]]
name = "train_rust_book"
path = "src/bin/train_rust_book.rs"

[[bin]]
name = "train_rust_book_lite"
path = "src/bin/train_rust_book_lite.rs"

[dependencies]
num-complex = "0.4"
rayon = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
reqwest = { version = "0.11", features = ["blocking", "json"] }
rustyline = "12.0"
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"
tower-http = { version = "0.5", features = ["cors", "fs"] }

[[bin]]
name = "bootstrap_facet"
path = "src/bin/bootstrap_facet.rs"

[[bin]]
name = "evaluate"
path = "src/bin/evaluate.rs"

[[bin]]
name = "experiment"
path = "src/bin/experiment.rs"

[[bin]]
name = "relations"
path = "src/bin/relations.rs"

[[bin]]
name = "forgetting"
path = "src/bin/forgetting.rs"

[[bin]]
name = "readout"
path = "src/bin/readout.rs"

[[bin]]
name = "conception"
path = "src/bin/conception.rs"

[[bin]]
name = "order"
path = "src/bin/order.rs"

[[bin]]
name = "defstats"
path = "src/bin/defstats.rs"

[[bin]]
name = "latency"
path = "src/bin/latency.rs"

[[bin]]
name = "sentence"
path = "src/bin/sentence.rs"

[[bin]]
name = "roles"
path = "src/bin/roles.rs"

[[bin]]
name = "topdown"
path = "src/bin/topdown.rs"

[[bin]]
name = "types"
path = "src/bin/types.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "ingest"
path = "src/bin/ingest.rs"

[profile.release]
opt-level = 3

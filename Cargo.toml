[package]
name = "phiano"
version = "0.1.0"
edition = "2021"

[lib]
name = "phiano"
path = "src/lib.rs"

[[bin]]
name = "phiano"
path = "src/main.rs"

[[bin]]
name = "train_rust_book"
path = "src/bin/train_rust_book.rs"

[[bin]]
name = "train_rust_book_lite"
path = "src/bin/train_rust_book_lite.rs"

[dependencies]
num-complex = "0.4"
rayon = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
reqwest = { version = "0.11", features = ["blocking", "json"] }
rustyline = "12.0"
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"
tower-http = { version = "0.5", features = ["cors", "fs"] }

[[bin]]
name = "bootstrap_facet"
path = "src/bin/bootstrap_facet.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "ingest"
path = "src/bin/ingest.rs"

[profile.release]
opt-level = 3

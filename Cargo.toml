[package]
name = "phiano"
version = "0.2.0"
edition = "2021"
# Every binary is declared below; a stale file under src/bin/ is not a target.
autobins = false

[lib]
name = "phiano"
path = "src/lib.rs"

[[bin]]
name = "phiano"
path = "src/main.rs"

[[bin]]
name = "train_rust_book"
path = "src/bin/rust/book.rs"

[features]
default = []

[dependencies]
num-complex = "0.4"
phistd = { path = "../phistd" }
phiton = { path = "../phiton" }
phical = { path = "../phical" }
phifno = { path = "../phifno" }
phient = { path = "../phient" }
phiecs = { path = "../phiecs" }
phiclm = { path = "../phiclm" }
rayon = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = "1"
reqwest = { version = "0.11", features = ["blocking", "json"] }
rustyline = "12.0"
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"
tower-http = { version = "0.5", features = ["cors", "fs"] }

[[bin]]
name = "bootstrap_facet"
path = "src/bin/bootstrap/facet.rs"

[[bin]]
name = "evaluate"
path = "src/bin/evaluate.rs"

[[bin]]
name = "prepare_prose"
path = "src/bin/prepare/prose.rs"

[[bin]]
name = "ingest"
path = "src/bin/ingest.rs"

[[bin]]
name = "word_json"
path = "src/bin/word/json.rs"

[[bin]]
name = "bpe_check"
path = "src/bin/bpe/check.rs"

[[bin]]
name = "bpe_lexicon"
path = "src/bin/bpe/lexicon.rs"

[[bin]]
name = "persona"
path = "src/bin/persona/main.rs"

[[bin]]
name = "quest"
path = "src/bin/quest/main.rs"

[[bin]]
name = "relate"
path = "src/bin/relate/main.rs"

[[bin]]
name = "helix"
path = "src/bin/helix/main.rs"

[[example]]
name = "riley"
path = "examples/riley/main.rs"

[package]
name = "phiano"
version = "0.2.0"
edition = "2021"
# Every binary is declared below; a stale file under src/bin/ is not a target.
autobins = false

[lib]
name = "phiano"
path = "src/lib.rs"

[[bin]]
name = "phiano"
path = "src/main.rs"

[[bin]]
name = "train_rust_book"
path = "src/bin/rust/book.rs"

[features]
default = []
# The Gen-0 "phinum" model (I Ching hexagrams over a syntax parser): kept
# only for the `in_c` experiment and its juncture test (docs/163).
phinum = []

[dependencies]
num-complex = "0.4"
phistd = { path = "../phistd" }
phiton = { path = "../phiton" }
phical = { path = "../phical" }
phifno = { path = "../phifno" }
phiplm = { path = "../phiplm" }
phikit = { path = "../phikit" }
phiecs = { path = "../phiecs" }
rayon = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = "1"
reqwest = { version = "0.11", features = ["blocking", "json"] }
rustyline = "12.0"
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"
tower-http = { version = "0.5", features = ["cors", "fs"] }

[[bin]]
name = "bootstrap_facet"
path = "src/bin/bootstrap/facet.rs"

[[bin]]
name = "evaluate"
path = "src/bin/evaluate.rs"

[[bin]]
name = "prepare_prose"
path = "src/bin/prepare/prose.rs"

[[bin]]
name = "ingest"
path = "src/bin/ingest.rs"

[[bin]]
name = "word_json"
path = "src/bin/word/json.rs"

[[bin]]
name = "bpe_check"
path = "src/bin/bpe/check.rs"

[[bin]]
name = "bpe_lexicon"
path = "src/bin/bpe/lexicon.rs"

[[bin]]
name = "persona_ingest"
path = "src/bin/persona_ingest/main.rs"

[[bin]]
name = "persona_chat"
path = "src/bin/persona_chat/main.rs"

[[bin]]
name = "quest_ingest"
path = "src/bin/quest_ingest/main.rs"

[[bin]]
name = "quest_ask"
path = "src/bin/quest_ask/main.rs"

[[bin]]
name = "relate_ask"
path = "src/bin/relate_ask/main.rs"

[[bin]]
name = "persona_from_quest"
path = "src/bin/persona_from_quest/main.rs"

[[bin]]
name = "helix"
path = "src/bin/helix/main.rs"

[[example]]
name = "in_c"
path = "examples/in_c/main.rs"
required-features = ["phinum"]
